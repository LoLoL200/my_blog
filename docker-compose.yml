

services:
  blog:
    build: .
    container_name: my_blog_app

    env_file:
      - .env

    ports:
      - "8080:8080"

    environment:
      - PORT=8080
      - DATA_DIR=/app/data

    volumes:
      - blog_data:/app/data

    restart: unless-stopped

    networks:
      - blog_network

volumes:
  blog_data:

networks:
  blog_network: